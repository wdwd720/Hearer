# Hearer label taxonomy (V1).
#
# These labels are first-class to the Hearer brain. The runtime classifier
# emits Hearer labels directly. The dataset path maps source-dataset labels
# (ESC-50, UrbanSound8K, FSD50K / AudioSet) onto these.
#
# Mapping notes are best-effort and conservative — empty lists mean "not
# present in that source", not "we tried to map it". Tighten over time as
# we validate clip-by-clip.

version: 1

categories:
  - safety
  - home
  - speech_social
  - navigation_spatial
  - unknown

labels:
  timer_beep:
    displayName: "Timer / beeping"
    category: safety
    defaultPriority: high
    actionType: physical
    minConfidenceForInterrupt: 0.55
    cueTemplates:
      kitchen_cooking: "Kitchen timer beeping.\nCheck stove."
      generic: "Timer beeping.\nCheck nearby."
    sourceMappings:
      esc50:
        - clock_alarm
      urbansound8k: []
      fsd50k:
        - "Beep, bleep"
        - "Alarm"
        - "Microwave oven"

  alarm:
